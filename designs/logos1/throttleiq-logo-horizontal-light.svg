<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="149.93" y1="376.07" x2="362.07" y2="376.07" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="tipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge / icon, scaled + translated copy of the app icon mark -->
  <g transform="translate(20,30) scale(0.390625)">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
    <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#E2E8F0" stroke-width="3"/>

    <path d="M 149.93,376.07 A 150,150 0 1 1 362.07,376.07"
          fill="none" stroke="url(#arcGrad)" stroke-width="40" stroke-linecap="round"/>

    <g stroke="#94A3B8" stroke-width="6" stroke-linecap="round" opacity="0.6">
        <line x1="256" y1="120" x2="256" y2="140" transform="rotate(-135 256 270)"/>
        <line x1="256" y1="120" x2="256" y2="140" transform="rotate(-67.5 256 270)"/>
        <line x1="256" y1="120" x2="256" y2="140" transform="rotate(0 256 270)"/>
        <line x1="256" y1="120" x2="256" y2="140" transform="rotate(67.5 256 270)"/>
        <line x1="256" y1="120" x2="256" y2="140" transform="rotate(135 256 270)"/>
    </g>

    <!-- needle -->
    <line x1="256" y1="270" x2="381.9" y2="224.2" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
    <circle cx="256" cy="270" r="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="6"/>

    <!-- intelligence pulse / data point at needle tip -->
    <circle cx="396.95" cy="218.7" r="48" fill="url(#tipGlow)"/>
    <circle cx="396.95" cy="218.7" r="15" fill="#22C55E"/>
    <circle cx="396.95" cy="218.7" r="24" fill="none" stroke="#22C55E" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="250" y="152" font-size="82" font-weight="600" fill="#0F172A" letter-spacing="-1">Throttle<tspan font-weight="800" fill="#22C55E">IQ</tspan></text>

  <!-- tagline -->
  <text x="252" y="192" font-size="22" font-weight="400" fill="#64748B" letter-spacing="1.5">MACHINE MEMORY FOR MOTORCYCLES</text>
</svg>
