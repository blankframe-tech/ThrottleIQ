# Applies to scripts/package-lock.json only (osv-scanner reads the config next to the lockfile).
# Same two advisories and chain as functions/osv-scanner.toml: firebase-admin 14 >
# @google-cloud/firestore > google-gax 5.0.8 > rimraf 5 > glob 10.5.0 > minimatch 9.0.9.
# google-gax declares rimraf but never loads it; fixes exist only in glob 14 / minimatch 11,
# which rimraf 5 can't take. Drop these once google-gax updates.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-31
reason = "glob via google-gax > rimraf, never loaded; fix only in glob 14"

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "minimatch via google-gax > rimraf > glob, never loaded; fix only in minimatch 11"
