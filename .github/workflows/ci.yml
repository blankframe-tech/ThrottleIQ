# Checks every push and PR: the Flutter app, the Firestore security rules
# (against the real emulator), and the Cloud Functions build.
# To make these gate merges, mark the three jobs as required status checks in
# the repo's branch protection settings for `main`.
name: ci

on:
  push:
  pull_request:

# Every job only checks out code and runs local tools; nothing writes to the
# repo, so the GITHUB_TOKEN gets read-only access (issues §101.S10).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the format check can diff against the push/PR base.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version used locally (`flutter --version`).
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Must stay clean: any issue, info-level lints included, fails the job.
      - run: flutter analyze
      # Run even when analyze fails, so a lint can't hide a test failure
      # (that's how main went untested from 2026-09-30, §90.B1).
      - run: flutter test
        if: ${{ !cancelled() }}
      # Raw `x['k'] as double` casts crash on an int from Firestore/JSON
      # (grill 78, §1.3.4). Use asDouble/asDoubleOrNull from
      # core/utils/num_cast.dart instead.
      - name: Guard against raw `as double` casts
        working-directory: .
        run: '! grep -rnE "\] as double\b" app/lib'
      # Ratchet (§90.B6): bare `catch (_)` swallows errors silently. The count
      # may only go down. Lower the number when you remove some; prefer
      # reportNonFatal (core/utils/error_reporter.dart) for handled errors.
      - name: Ratchet bare catch (_) count
        working-directory: .
        run: |
          count=$(grep -rn "catch (_)" app/lib | wc -l)
          echo "bare catch (_): $count (max 67)"
          test "$count" -le 67
      # Formatting is checked on changed Dart files only, so a stray
      # whole-folder `dart format` shows up as a failing diff instead of noise.
      - name: Format check (changed Dart files)
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; skipping."; exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'app/*.dart' \
            | grep -vE '(\.g\.dart|l10n/app_localizations.*\.dart)$' || true)
          [ -z "$files" ] && { echo "No Dart changes."; exit 0; }
          echo "$files" | xargs dart format --output=none --set-exit-if-changed
      # Team NJ4675FFUX is a personal Apple team: paid-only entitlements
      # (Associated Domains, push, iCloud, Sign in with Apple) break every
      # iPhone build. See .agents/skills/deploy/SKILL.md.
      - name: Guard against paid-only iOS entitlements
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          ! grep -nE '<key>(com\.apple\.developer\.(associated-domains|icloud[^<]*|applesignin|usernotifications[^<]*)|aps-environment)</key>' \
            app/ios/*/*.entitlements

  rules:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # firebase-tools' Firestore emulator needs a JDK 21+.
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pinned to the major the rules/rtdb suites pass with locally, so a new
      # firebase-tools major can't break the emulator jobs unannounced.
      - run: npm install -g firebase-tools@15
      # scripts/ has no committed lockfile (its .gitignore drops *.json), so
      # this is `npm install`, not `npm ci`.
      - run: npm install
      - run: npm test
      # Same as `npm run test:rules` minus the Mac-only JAVA_HOME.
      - run: npm run test:rules:ci
      # Realtime Database: rules + two-client WebSocket delivery suite.
      - run: npm run test:rtdb:ci

  functions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      # Unit tests for the pure helpers (cloudinary-ownership, rider-name);
      # builds first, no emulator needed.
      - run: npm test
