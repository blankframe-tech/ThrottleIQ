# Checks every push and PR: the Flutter app, the Firestore security rules
# (against the real emulator), and the Cloud Functions build.
# To make these gate merges, mark the three jobs as required status checks in
# the repo's branch protection settings for `main`.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version used locally (`flutter --version`).
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Must stay clean: any issue, info-level lints included, fails the job.
      - run: flutter analyze
      - run: flutter test
      # Raw `x['k'] as double` casts crash on an int from Firestore/JSON
      # (grill 78, §1.3.4). Use asDouble/asDoubleOrNull from
      # core/utils/num_cast.dart instead.
      - name: Guard against raw `as double` casts
        working-directory: .
        run: '! grep -rnE "\] as double\b" app/lib'

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools' Firestore emulator needs a JDK 21+.
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      # scripts/ has no committed lockfile (its .gitignore drops *.json), so
      # this is `npm install`, not `npm ci`.
      - run: npm install
      - run: npm test
      # Same as `npm run test:rules` minus the Mac-only JAVA_HOME.
      - run: npm run test:rules:ci

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
