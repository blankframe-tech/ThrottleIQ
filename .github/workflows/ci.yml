# Checks every PR and every push to main: the Flutter app, the Firestore security rules
# (against the real emulator), and the Cloud Functions build.
# To make these gate merges, mark the three jobs as required status checks in
# the repo's branch protection settings for `main`.
name: ci

on:
  # Pushes to other branches are covered by their PR; one run each (#53).
  push:
    branches: [main]
  pull_request:

# Every job only checks out code and runs local tools; nothing writes to the
# repo, so the GITHUB_TOKEN gets read-only access (issues §101.S10).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so the format check can diff against the push/PR base.
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep in step with the version used locally (`flutter --version`).
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Every app check (l10n, format, guards, analyze, test) lives in
      # scripts/check.sh, the same gate run locally and before each push.
      # It runs all checks and fails once at the end, so a lint can't hide a
      # test failure (§90.B1). Rules and functions have their own jobs below.
      - name: Quality gate (scripts/check.sh)
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            bash scripts/check.sh --ci --base "$BASE"
          else
            bash scripts/check.sh --ci --base HEAD~1
          fi
      # check.sh --ci runs the tests with --coverage and prints the total.
      - name: Upload coverage (lcov.info)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: warn

  rules:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # firebase-tools' Firestore emulator needs a JDK 21+.
          java-version: '21'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # Pinned to the major the rules/rtdb suites pass with locally, so a new
      # firebase-tools major can't break the emulator jobs unannounced.
      - run: npm install -g firebase-tools@15
      # scripts/ has no committed lockfile (its .gitignore drops *.json), so
      # this is `npm install`, not `npm ci`.
      - run: npm install
      - run: npm test
      # Same as `npm run test:rules` minus the Mac-only JAVA_HOME.
      - run: npm run test:rules:ci
      # Realtime Database: deny-all rules (RTDB retired, B9).
      - run: npm run test:rtdb:ci

  functions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      # Unit tests for the pure helpers (cloudinary-ownership, rider-name);
      # builds first, no emulator needed.
      - run: npm test
