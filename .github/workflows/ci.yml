# Checks every push and PR: the Flutter app, the Firestore security rules
# (against the real emulator), and the Cloud Functions build.
# To make these gate merges, mark the three jobs as required status checks in
# the repo's branch protection settings for `main`.
name: ci

on:
  push:
  pull_request:

# Every job only checks out code and runs local tools; nothing writes to the
# repo, so the GITHUB_TOKEN gets read-only access (issues §101.S10).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the format check can diff against the push/PR base.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version used locally (`flutter --version`).
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Every app check (l10n, format, guards, analyze, test) lives in
      # scripts/check.sh, the same gate run locally and before each push.
      # It runs all checks and fails once at the end, so a lint can't hide a
      # test failure (§90.B1). Rules and functions have their own jobs below.
      - name: Quality gate (scripts/check.sh)
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            bash scripts/check.sh --ci --base "$BASE"
          else
            bash scripts/check.sh --ci --base HEAD~1
          fi

  rules:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # firebase-tools' Firestore emulator needs a JDK 21+.
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pinned to the major the rules/rtdb suites pass with locally, so a new
      # firebase-tools major can't break the emulator jobs unannounced.
      - run: npm install -g firebase-tools@15
      # scripts/ has no committed lockfile (its .gitignore drops *.json), so
      # this is `npm install`, not `npm ci`.
      - run: npm install
      - run: npm test
      # Same as `npm run test:rules` minus the Mac-only JAVA_HOME.
      - run: npm run test:rules:ci
      # Realtime Database: rules + two-client WebSocket delivery suite.
      - run: npm run test:rtdb:ci

  functions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      # Unit tests for the pure helpers (cloudinary-ownership, rider-name);
      # builds first, no emulator needed.
      - run: npm test
