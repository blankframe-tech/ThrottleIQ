# Asks every outside contributor to sign CLA.md once, by PR comment, and
# fails the "CLAAssistant" check until they do. Signatures are committed to
# signatures/cla.json on the `cla-signatures` branch, so main never gets bot
# commits. That branch must exist and must not be protected.
# pull_request_target runs this file from the PR's base branch with write
# access, so it never checks out or runs the contributor's code.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the v2.6.1 commit: this job holds a write token.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/blankframe-tech/ThrottleIQ/blob/main/CLA.md
          branch: cla-signatures
          allowlist: the-abraar,blankframe-tech,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
