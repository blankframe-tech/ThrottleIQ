name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The release you installed, e.g. beta-v4.7.1 from GitHub Releases, or "Play internal testing"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and OS
      placeholder: e.g. Redmi Note 12, Android 14
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [English, বাংলা]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove anything private (home location, phone numbers) before you post.
