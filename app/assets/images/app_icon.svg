<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12161B"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Squircle boundary, concentric with the icon's own corner radius rather than a circle,
       inset by half the stroke width so its outer edge sits flush against the icon's edge. -->
  <rect x="5" y="5" width="502" height="502" rx="107" fill="none" stroke="#F8FAFC" stroke-width="10"/>

  <text x="256" y="128" font-family="Manrope, sans-serif" font-weight="900" font-size="62"
        letter-spacing="3" fill="#F8FAFC" text-anchor="middle">THROTTLE</text>

  <circle cx="170" cy="300" r="62" fill="none" stroke="#F8FAFC" stroke-width="16"/>
  <circle cx="342" cy="300" r="62" fill="none" stroke="#F8FAFC" stroke-width="16"/>
  <circle cx="170" cy="300" r="9" fill="#FF6A00"/>
  <circle cx="342" cy="300" r="9" fill="#FF6A00"/>
  <polyline points="205,255 225,210 256,195 287,210 307,255"
            fill="none" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="195" r="13" fill="#FF6A00"/>

  <text x="256" y="432" font-family="Manrope, sans-serif" font-weight="900" font-size="80"
        letter-spacing="4" fill="#F8FAFC" text-anchor="middle">IQ</text>
</svg>
