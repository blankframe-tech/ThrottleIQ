name: throttleiq
description: Motorcycle tracking, intelligence, and memory platform
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.1.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # Sensors
  sensors_plus: ^4.0.2

  # Local Database (Offline-first)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # tel: and geo: links (e.g. Directions and Call on a place's detail
  # screen). ThrottleIQ deliberately does NOT route to a destination itself —
  # see place_directions.dart.
  url_launcher: ^6.2.5

  # Image
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  image: ^4.1.0

  # Haptics / Feedback
  vibration: ^2.0.0
  flutter_local_notifications: ^17.2.0
  # Required by flutter_local_notifications' zonedSchedule, which is what makes
  # the day-end summary fire at the same wall-clock hour every day instead of
  # drifting the way a fixed 24-hour interval would. flutter_timezone supplies
  # the device's zone name to seed it.
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Background tracking.
  #
  # wakelock_plus keeps the SCREEN awake during a manually-started ride — it is
  # not, and never was, background tracking. Background GPS *during* a ride
  # comes from geolocator's foreground service (see ride_recording_provider).
  #
  # flutter_background_geolocation is what detects a ride starting when the app
  # isn't open: platform activity recognition, iOS significant-location-change,
  # an Android foreground service that survives OEM battery killers, and a
  # headless Dart isolate — the four things that have to cooperate for all-day
  # detection, as one tested unit.
  #
  # LICENCE: Android *release* builds require a key in AndroidManifest.xml
  # (com.transistorsoft.locationmanager.license). Debug builds run unlicensed.
  # Without a key the plugin refuses to start in release — a hard gate before
  # shipping. See https://shop.transistorsoft.com
  wakelock_plus: ^1.2.8
  flutter_background_geolocation: ^4.16.0

  # Sharing
  share_plus: ^10.0.0

  # Battery
  battery_plus: ^6.0.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # Home-screen widgets (Android App Widget / iOS WidgetKit bridge)
  home_widget: ^0.6.0

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.1

  # Utilities
  uuid: ^4.4.0
  # Pinned to 0.20.2 by flutter_localizations from the Flutter SDK; bumped from
  # ^0.19.0 when localization was added. Only one call site (DateFormat in
  # user_profile_screen.dart), so the major-version move was low risk.
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.4.0+3

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    # Bundled (not fetched via google_fonts at runtime) so Bangla glyphs are
    # available offline from first launch — the app's Bangla-speaking riders
    # are exactly the audience most likely to be on a patchy connection. None
    # of the IBM Plex / Space Grotesk faces this app otherwise uses ship
    # Bengali glyphs, so without this, Bangla text silently falls back to
    # whatever the platform happens to have, in a typeface that doesn't match
    # the rest of the UI. See app_typography.dart / app_theme.dart for where
    # it's wired in as a fontFamilyFallback. Single variable-font file
    # (weight axis) rather than separate static weights per style — this is a
    # fallback face for glyph coverage, not the primary display type, so one
    # instance covering the whole weight range is enough.
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
