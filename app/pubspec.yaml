name: throttleiq
description: Motorcycle tracking, intelligence, and memory platform
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.1.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # Sensors
  sensors_plus: ^4.0.2

  # Local Database (Offline-first)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # tel: and geo: links (e.g. Directions and Call on a place's detail
  # screen). ThrottleIQ deliberately does NOT route to a destination itself —
  # see place_directions.dart.
  url_launcher: ^6.2.5

  # Image
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  image: ^4.1.0

  # Haptics / Feedback
  vibration: ^2.0.0
  flutter_local_notifications: ^17.2.0
  # Required by flutter_local_notifications' zonedSchedule, which is what makes
  # the day-end summary fire at the same wall-clock hour every day instead of
  # drifting the way a fixed 24-hour interval would. flutter_timezone supplies
  # the device's zone name to seed it.
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Background tracking.
  #
  # wakelock_plus keeps the SCREEN awake during a manually-started ride — it is
  # not, and never was, background tracking. Background GPS *during* a ride
  # comes from geolocator's foreground service (see ride_recording_provider).
  #
  # flutter_activity_recognition + flutter_foreground_task detect a ride
  # starting when the app isn't open: platform activity recognition
  # (ActivityRecognitionClient on Android, CMMotionActivityManager on iOS) for
  # the "are they moving" signal, a persistent Android foreground service
  # (survives the app being swiped from recents) to keep that signal alive,
  # and geolocator (above) for fixes once vehicle motion is seen. Both free
  # (MIT). This is the free-tier stand-in for the paid
  # `flutter_background_geolocation` — see
  # docs/archives/flutter_background_geolocation-2026-08-28/README.md for why,
  # and docs/HANDOFF_Document.md's backlog for the paid plugin's pros/cons if
  # this ever needs revisiting.
  #
  # KNOWN GAP vs the paid plugin: on iOS, the task handler does not survive
  # the rider force-swiping ThrottleIQ from the app switcher (it does on
  # Android). The paid plugin's iOS significant-location-change wake-up
  # doesn't survive a user force-quit either, only an OS-initiated kill for
  # memory — so the practical gap is narrower than it first looks, but it is
  # not zero. See auto_tracking_service.dart's doc comment.
  wakelock_plus: ^1.2.8
  flutter_activity_recognition: ^4.0.0
  flutter_foreground_task: ^11.0.1

  # Sharing
  share_plus: ^10.0.0

  # Battery
  battery_plus: ^6.0.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # Home-screen widgets (Android App Widget / iOS WidgetKit bridge)
  home_widget: ^0.6.0

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.1

  # Voice notes ("Ride with friends" push-to-talk).
  #
  # record captures short push-to-talk clips; just_audio plays them back
  # (chosen over audioplayers for steadier interruption/completion-event
  # handling, which the sequential playback queue relies on); audio_session
  # configures the platform session so record/playback actually route
  # through a paired Bluetooth headset instead of the phone's own mic/
  # speaker. See group_ride_map_screen.dart.
  record: ^7.1.1
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Utilities
  uuid: ^4.4.0
  # Pinned to 0.20.2 by flutter_localizations from the Flutter SDK; bumped from
  # ^0.19.0 when localization was added. Only one call site (DateFormat in
  # user_profile_screen.dart), so the major-version move was low risk.
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.5
  permission_handler: ^11.3.1
  # Renders the SafeQR medical-info card as an on-device QR code — pure client-
  # side widget, no backend/scanning half needed since the payload is just
  # plain text a phone camera app already reads.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.4.0+3

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ launchers mask the adaptive icon into whatever shape the
  # device theme uses (circle, squircle, rounded square, teardrop...) — the
  # foreground content is inset to Android's safe-zone circle so the mark
  # survives any of them undamaged, rather than needing a separate asset per
  # shape.
  #
  # 2026-08-29: swapped to the speed-gauge mark (Issues.md §52).
  # adaptive_icon_background is sampled from that artwork's own background
  # (not pure black) so the flat backing color is invisible where it peeks
  # out past the inset foreground.
  adaptive_icon_background: "#131317"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive_fg.png"

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    # Bundled (not fetched via google_fonts at runtime) so Bangla glyphs are
    # available offline from first launch — the app's Bangla-speaking riders
    # are exactly the audience most likely to be on a patchy connection. None
    # of the IBM Plex / Space Grotesk faces this app otherwise uses ship
    # Bengali glyphs, so without this, Bangla text silently falls back to
    # whatever the platform happens to have, in a typeface that doesn't match
    # the rest of the UI. See app_typography.dart / app_theme.dart for where
    # it's wired in as a fontFamilyFallback. Single variable-font file
    # (weight axis) rather than separate static weights per style — this is a
    # fallback face for glyph coverage, not the primary display type, so one
    # instance covering the whole weight range is enough.
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
