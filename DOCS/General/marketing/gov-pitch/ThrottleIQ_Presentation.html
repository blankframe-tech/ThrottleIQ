<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThrottleIQ — Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101014;
    --bg-alt:#17171d;
    --card:#1c1c24;
    --card-border:#2a2a34;
    --cyan:#00e5ff;
    --amber:#ff9800;
    --green:#42b558;
    --red:#d84f2a;
    --text:#f5f6f8;
    --text-dim:#a0a0ac;
    --text-faint:#6b6b78;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  .bn{font-family:'Hind Siliguri','Inter',sans-serif;}
  h1,h2,h3,.disp{font-family:'Space Grotesk','Inter',sans-serif;}

  #deck{
    position:relative;
    width:100vw;height:100vh;
  }
  .slide{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(24px,5vw,72px) clamp(24px,7vw,110px);
    background:
      radial-gradient(circle at 85% 10%, rgba(0,229,255,0.09), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(255,152,0,0.07), transparent 40%),
      var(--bg);
    overflow-y:auto;
  }
  .slide.active{display:flex;}
  .kicker{
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-size:clamp(11px,1vw,13px);
    color:var(--cyan);
    font-weight:600;
    margin:0 0 10px 0;
  }
  .slide h1{
    font-size:clamp(28px,4.2vw,56px);
    line-height:1.08;
    margin:0 0 14px 0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .slide h2.section-title{
    font-size:clamp(24px,3.4vw,42px);
    line-height:1.12;
    margin:0 0 6px 0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-size:clamp(14px,1.4vw,19px);
    color:var(--text-dim);
    max-width:850px;
    line-height:1.5;
    margin:0 0 clamp(16px,2.4vw,32px) 0;
  }
  .divider{
    height:3px;width:56px;border-radius:2px;
    background:linear-gradient(90deg,var(--cyan),var(--amber));
    margin:0 0 20px 0;
  }
  .body-area{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}

  /* grids / cards */
  .grid{display:grid;gap:clamp(10px,1.4vw,18px);}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:clamp(14px,1.8vw,22px);
  }
  .card h3{
    font-size:clamp(14px,1.3vw,18px);
    margin:0 0 8px 0;
    font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .card p{
    font-size:clamp(12.5px,1.05vw,15px);
    color:var(--text-dim);
    line-height:1.5;
    margin:0;
  }
  .icon-badge{
    width:34px;height:34px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;flex-shrink:0;
  }
  .ic-cyan{background:rgba(0,229,255,0.14);color:var(--cyan);}
  .ic-amber{background:rgba(255,152,0,0.14);color:var(--amber);}
  .ic-green{background:rgba(66,181,88,0.14);color:var(--green);}
  .ic-red{background:rgba(216,79,42,0.14);color:var(--red);}

  ul.list{margin:0;padding:0;list-style:none;}
  ul.list li{
    position:relative;padding-left:22px;margin-bottom:10px;
    font-size:clamp(13px,1.15vw,16.5px);
    color:var(--text);line-height:1.5;
  }
  ul.list li::before{
    content:'';position:absolute;left:0;top:8px;
    width:8px;height:8px;border-radius:2px;
    background:var(--cyan);
  }
  ul.list.amber li::before{background:var(--amber);}
  ul.list li b{color:var(--text);}
  ul.list li .dim{color:var(--text-dim);}

  .stat{
    text-align:center;
  }
  .stat .num{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(28px,3.6vw,46px);
    font-weight:700;
    color:var(--cyan);
    line-height:1;
  }
  .stat .label{
    font-size:clamp(11px,0.95vw,13.5px);
    color:var(--text-dim);
    margin-top:8px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  table.cmp{
    width:100%;border-collapse:collapse;
    font-size:clamp(11px,0.95vw,14px);
  }
  table.cmp th,table.cmp td{
    padding:10px 12px;text-align:left;
    border-bottom:1px solid var(--card-border);
  }
  table.cmp th{
    color:var(--text-dim);font-weight:600;
    text-transform:uppercase;letter-spacing:0.04em;font-size:0.82em;
  }
  table.cmp td.hero-col{color:var(--cyan);font-weight:600;}
  table.cmp tr:last-child td{border-bottom:none;}

  .pill{
    display:inline-block;padding:4px 12px;border-radius:999px;
    font-size:clamp(11px,0.9vw,13px);font-weight:600;
    background:rgba(0,229,255,0.12);color:var(--cyan);
    border:1px solid rgba(0,229,255,0.3);
  }

  .flow{display:flex;align-items:stretch;gap:clamp(8px,1.5vw,20px);}
  .flow .fbox{flex:1;}
  .flow .arrow{display:flex;align-items:center;color:var(--text-faint);font-size:22px;}

  .logo-wrap{width:clamp(84px,10vw,140px);height:clamp(84px,10vw,140px);margin-bottom:20px;}
  .logo-wrap svg{width:100%;height:100%;display:block;}

  footer.foot{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--text-faint);
    padding-top:14px;margin-top:auto;
    border-top:1px solid var(--card-border);
  }

  /* nav chrome */
  #progress{
    position:fixed;top:0;left:0;height:3px;
    background:linear-gradient(90deg,var(--cyan),var(--amber));
    z-index:50;transition:width .25s ease;
  }
  #controls{
    position:fixed;bottom:18px;right:22px;
    display:flex;align-items:center;gap:12px;
    z-index:50;font-size:13px;color:var(--text-dim);
    font-family:'Inter',sans-serif;
  }
  #controls button{
    width:38px;height:38px;border-radius:10px;
    background:var(--card);border:1px solid var(--card-border);
    color:var(--text);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #controls button:hover{border-color:var(--cyan);color:var(--cyan);}
  #counter{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;}
  #dots{
    position:fixed;bottom:18px;left:22px;display:flex;gap:6px;z-index:50;
  }
  #dots span{
    width:6px;height:6px;border-radius:50%;background:var(--card-border);
    transition:background .2s;
  }
  #dots span.on{background:var(--cyan);}

  @media (max-width:720px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}
    .flow{flex-direction:column;}
    .flow .arrow{transform:rotate(90deg);justify-content:center;}
    #dots{display:none;}
  }
  @media (max-width:480px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  }

  @media print{
    body{overflow:visible;}
    #controls,#dots,#progress{display:none;}
    #deck{position:static;width:auto;height:auto;}
    .slide{
      display:flex!important;
      position:static;
      width:100vw;height:100vh;
      page-break-after:always;
      overflow:hidden;
    }
  }
</style>
</head>
<body>

<div id="progress" style="width:0%"></div>

`<div class="body-area" style="justify-content:center;align-items:flex-start;">

`<div class="kicker">The Problem</div>
<h2 class="section-title">Bangladesh's roads move on two wheels — with almost no safety net</h2>

<div class="body-area">

<div class="divider"></div>
<div class="body-area">

const deck = document.getElementById('deck');
slides.forEach((html,i)=>{
  const d = document.createElement('div');
  d.className = 'slide' + (i===0?' active':'');
  d.innerHTML = html;
  deck.appendChild(d);
});

const dotsEl = document.getElementById('dots');
slides.forEach((_,i)=>{
  const s = document.createElement('span');
  if(i===0) s.className='on';
  dotsEl.appendChild(s);
});

let current = 0;
const total = slides.length;
const slideEls = document.querySelectorAll('.slide');
const dotEls = document.querySelectorAll('#dots span');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');

function render(){
  slideEls.forEach((el,i)=>el.classList.toggle('active', i===current));
  dotEls.forEach((el,i)=>el.classList.toggle('on', i===current));
  counter.textContent = (current+1) + ' / ' + total;
  progress.style.width = ((current+1)/total*100) + '%';
}
function go(n){
  current = Math.max(0, Math.min(total-1, n));
  render();
}

document.getElementById('prevBtn').addEventListener('click', ()=>go(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>go(current+1));

window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); go(current+1); }
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(current-1); }
  if(e.key==='Home') go(0);
  if(e.key==='End') go(total-1);
});

let touchX = null;
window.addEventListener('touchstart', (e)=>{ touchX = e.touches[0].clientX; });
window.addEventListener('touchend', (e)=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50){ dx < 0 ? go(current+1) : go(current-1); }
  touchX = null;
});

render();
</script>
</body>
