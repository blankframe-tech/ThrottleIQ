  <!-- Main Crown Bulb -->
  <circle cx="405.56" cy="172.14" r="15.5" fill="#FFFFFF"/>

  <!-- Supernova Flare Layer -->
  
    <!-- Supernova Aura -->
    <circle cx="405.56" cy="172.14" r="56.3" fill="url(#supernova_inapp_halo)"/>
    
    <!-- 8-point Supernova Starburst -->
    <g transform="translate(405.56, 172.14)">
      <polygon points="-69.0,0 0,-7.5 69.0,0 0,7.5" fill="url(#supernova_inapp_beam)"/>
      <polygon points="0,-69.0 -7.5,0 0,69.0 7.5,0" fill="url(#supernova_inapp_beam)"/>
      <g transform="rotate(45)">
        <polygon points="-41.4,0 0,-4.3 41.4,0 0,4.3" fill="url(#supernova_inapp_beam)" opacity="0.85"/>
        <polygon points="0,-41.4 -4.3,0 0,41.4 4.3,0" fill="url(#supernova_inapp_beam)" opacity="0.85"/>
