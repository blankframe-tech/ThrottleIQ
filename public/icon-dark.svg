  </defs>

  <rect width="512" height="512" fill="#131317"/>

  <!-- Speedometer Arc -->
  <path d="M 142.87,396.82 A 176.00,176.00 0 0 1 286.56,88.67" fill="none" stroke="#4A80E8" stroke-width="38.0" stroke-linecap="round"/>
