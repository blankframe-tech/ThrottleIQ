  <circle cx="430.29" cy="237.51" r="19.0" fill="#DE6032"/>
  <path d="M 430.29,237.51 A 176.00,176.00 0 0 1 369.13,396.82" fill="none" stroke="#D84F2A" stroke-width="38.0" stroke-linecap="round"/>

  <!-- Instrument Ticks -->
  <line x1="149.82" y1="368.18" x2="113.28" y2="404.72" stroke="rgba(255, 255, 255, 0.26)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="362.18" y1="368.18" x2="398.72" y2="404.72" stroke="rgba(255, 255, 255, 0.26)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Needle & Hub -->
  <path d="M 267.57,247.76 L 402.34,166.78 L 408.78,177.49 L 274.01,258.47 Z" fill="#FFFFFF"/>
  <circle cx="256.00" cy="262.00" r="23.0" fill="#FFFFFF"/>
  <circle cx="256.00" cy="262.00" r="17.2" fill="#131317"/>

