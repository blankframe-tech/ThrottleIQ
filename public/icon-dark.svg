  <line x1="405.56" y1="172.14" x2="437.76" y2="147.99" stroke="#B0C4DE" stroke-width="3.8" stroke-linecap="round" opacity="0.88"/>
  <line x1="405.56" y1="172.14" x2="433.73" y2="193.41" stroke="#B0C4DE" stroke-width="3.8" stroke-linecap="round" opacity="0.88"/>
  <line x1="405.56" y1="172.14" x2="386.58" y2="194.56" stroke="#B0C4DE" stroke-width="3.8" stroke-linecap="round" opacity="0.88"/>

  <!-- Satellite Nodes -->
  <circle cx="437.76" cy="147.99" r="10.6" fill="#42B558"/>
  <circle cx="433.73" cy="193.41" r="9.5" fill="#FFFFFF"/>
